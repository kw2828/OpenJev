[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openjev"
version = "0.1.0"
description = "An independent typed-decision model and live ViZDoom playground"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
dependencies = [
  "numpy>=2,<3", "vizdoom==1.3.0", "pillow>=11,<13",
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1",
]

[project.optional-dependencies]
train = ["torch>=2.6,<3"]
dev = ["pytest>=8,<10", "ruff>=0.12"]

[project.scripts]
openjev = "openjev.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/openjev"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
